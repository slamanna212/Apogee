version: 2

# All update PRs target `dev`, not `main`. `dev` is the active development
# branch; `main` only moves when a release is cut. Note this file is read from
# the repository's DEFAULT branch (main), so it must be updated there to take
# effect. Consequence of `target-branch`: security-update PRs still target the
# default branch, and per-ecosystem options here no longer apply to them.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: increase
    open-pull-requests-limit: 10
    commit-message:
      prefix: "npm"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      mantine:
        patterns:
          - "@mantine/*"
      tauri:
        patterns:
          - "@tauri-apps/*"
      fontsource:
        patterns:
          - "@fontsource/*"
      types:
        patterns:
          - "@types/*"
      postcss:
        patterns:
          - "postcss"
          - "postcss-*"
      react:
        patterns:
          - "react"
          - "react-dom"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: auto
    open-pull-requests-limit: 10
    commit-message:
      prefix: "cargo"
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-build"
          - "tauri-plugin-*"
      objc2:
        patterns:
          - "objc2*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
